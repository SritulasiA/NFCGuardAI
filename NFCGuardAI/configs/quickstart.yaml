project: NFCGuardAI-SMOKE
seed: 42
dataset:
  length: 1800
  sample_rate: 10000000
  store: data/processed
  channels: auto
  strict_lengths: true
  strict_labels: true
  label_map: null
  cache_dtype: float16
preprocessing:
  mode: per_channel
  epsilon: 1.0e-6
  augment_wireless: true
  augment_probability: 0.5
model:
  name: iqsecurenet
  widths: [8, 12, 16, 24, 32, 40]
  kernels: [7, 5, 5, 5, 3, 3]
  strides: [1, 2, 2, 2, 1, 1]
  dropout: 0.3
  hidden: 32
  pooling: gap
  squeeze_excitation: false
training:
  batch_size: 8
  epochs: 2
  patience: 2
  lr: 0.001
  weight_decay: 0.0001
  step_size: 10
  gamma: 0.5
  class_weighted: true
  num_workers: 0
  device: cpu
  stratified_batches: true
  deterministic: true
  amp: false
calibration:
  threshold: 0.5
experiments:
  cv_folds: 3
  cv_seeds: [0,1,2]
  ci: 0.95
  figure_dpi: 600
